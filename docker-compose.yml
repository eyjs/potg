version: '3.8'

services:
  backend:
    container_name: potg-backend
    platform: linux/arm64
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8100:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=potg_db
      # 서버 시간대 KST (타임스탬프는 UTC 저장, 서버 로컬시각·로그를 KST로)
      - TZ=Asia/Seoul
      # JWT_SECRET은 gitignore된 루트 .env에서 주입 (시크릿 미커밋). master는 미설정 시 부팅 throw.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in root .env}
    volumes:
      - uploads_data:/usr/src/app/uploads
    depends_on:
      - db
    networks:
      - potg-network
    restart: always

  frontend:
    container_name: potg-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8100
    depends_on:
      - backend
    networks:
      - potg-network
    restart: always

  db:
    container_name: potg-postgres
    image: postgres:16-alpine
    platform: linux/arm64
    ports:
      - "8101:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: potg_db
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - potg-network
    restart: always

networks:
  potg-network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
